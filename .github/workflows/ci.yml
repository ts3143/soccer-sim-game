# Lean CI: every pull request (and every push to main) must lint, test, build, pass
# the new-league generation checks and run the calibration harness. Cloudflare Pages does the deploys separately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # includes the real-club-name bundle check
      - run: pnpm generate --check
      - run: pnpm calibrate
