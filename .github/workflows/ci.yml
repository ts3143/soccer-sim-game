# Lean CI: every pull request (and every push to main) must lint, test and build, pass the
# new-league generation checks and the calibration harnesses. Two jobs run side by side
# (each about 6 minutes on GitHub's runners). Cloudflare Pages does the deploys separately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # includes the real-club-name bundle check

  calibrate:
    name: Generation and calibration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate --check
      - run: pnpm calibrate --check # match engine: per-match targets and league styles
      - run: pnpm calibrate --world --check # season loop: 3 worlds x 20 seasons, about 5 minutes
      - run: pnpm calibrate --world superLeague --check # Super League tiers: 3 worlds x 20 seasons
